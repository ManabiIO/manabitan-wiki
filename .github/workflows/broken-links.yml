name: External documentation links
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/prepare-assets.py && python -m mkdocs build --strict
      - run: python scripts/check-site.py site
      - uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: --no-progress --scheme https --exclude '^https://manabi.io/manabitan/' 'site/**/*.html'
