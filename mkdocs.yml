site_name: Manabitan
site_url: https://manabi.io/manabitan/
site_description: Yomitan's familiar reading workflow with faster imports and lookups, dramatically smaller installed dictionaries, background updates, MDX support, and easier Anki setup.
site_author: Manabitan contributors
repo_url: https://github.com/ManabiIO/manabitan-wiki
repo_name: Edit the documentation
edit_uri: edit/master/docs/
nav:
  - Home: index.md
  - Why Manabitan?: why-manabitan.md
  - Getting started:
      - Installation and setup: getting-started.md
      - Moving from Yomitan: yomitan-migration.md
      - Moving from Yomichan: yomichan-migration.md
  - Using Manabitan:
      - Dictionaries: dictionaries.md
      - Anki: anki.md
      - Advanced features: advanced.md
      - Tools and resources: tools-resources.md
      - Language support: supported-languages.md
  - Support: support.md
  - About:
      - Why Manabitan is a fork: about-manabitan.md
      - Contributing: contributing.md
      - Privacy and permissions: privacy.md
      - Credits: credits.md
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  favicon: assets/icon/manabitan-icon64.png
  logo: assets/icon/manabitan-icon128.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: Switch to light mode
extra:
  homepage: https://manabi.io/manabitan/
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ManabiIO/manabitan
      name: Manabitan extension source
    - icon: fontawesome/brands/discord
      link: https://discord.gg/gvxzS93C3w
      name: Manabi community and support
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search:
      lang: [en, ja]
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
exclude_docs: |
  manabitan-pdf-viewer/*.sh
  manabitan-pdf-viewer/*.odt
extra_css:
  - stylesheets/brand.css
  - stylesheets/extra.css
copyright: |
  Manabitan documentation, adapted from <a href="https://github.com/yomidevs/yomitan-wiki">Yomitan Wiki</a>.<br>
  Content: <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> ·
  <a href="https://manabi.io/manabitan/privacy/">Privacy and permissions</a> ·
  <a href="https://manabi.io/manabitan/credits/">Credits</a>
